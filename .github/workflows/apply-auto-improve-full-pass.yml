name: Apply full-book auto-improve pass

on:
  push:
    branches:
      - agent/auto-improve-book-pilot
    paths:
      - scripts/apply_auto_improve_full_pass.py
      - .github/workflows/apply-auto-improve-full-pass.yml

permissions:
  contents: write

jobs:
  apply-build-validate:
    if: ${{ !contains(github.event.head_commit.message, '[auto-pass-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out pilot branch
        uses: actions/checkout@v7
        with:
          ref: agent/auto-improve-book-pilot
          fetch-depth: 0

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc

      - name: Apply reviewed surgical edits
        run: python3 scripts/apply_auto_improve_full_pass.py

      - name: Build and validate web book
        run: ./scripts/build-site.sh

      - name: Check whitespace errors
        run: git diff --check

      - name: Show change summary
        run: |
          git status --short
          git diff --stat

      - name: Commit full-book pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters README.md WRITING_BRIEF.md model/axmm-v0.2.md 04_manuscript.md docs/index.html results/full-book-gpt56-pass.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "전권 auto-improve 품질 패스 적용 [auto-pass-applied]"
          git push origin HEAD:agent/auto-improve-book-pilot
