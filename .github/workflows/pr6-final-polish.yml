name: PR6 final polish

on:
  push:
    branches:
      - agent/auto-improve-book-pilot

permissions:
  contents: write

jobs:
  polish-build-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/auto-improve-book-pilot
          fetch-depth: 0

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Apply exact final editorial fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          edits = {
              "chapters/01_draft.md": [
                  (
                      "이 목록에 도구 이름이 하나도 없다는 점을 눈여겨보자. 전략, 숙련도, 가드레일, 모니터링. 전부 **살 수 없는 것들**이다. 결제하면 다음 주에 도착하는 물건이 아니라, 조직이 시간을 들여 정하고 합의하고 몸에 붙여야 하는 것들이다.",
                      "이 목록에 도구 이름이 하나도 없다는 점을 눈여겨보자. 전략, 숙련도, 가드레일, 모니터링. 전부 **도구 구매만으로 해결되지 않는 것들**이다. 가드레일과 모니터링 도구는 살 수 있어도, 무엇을 기준으로 어떻게 쓸지는 조직이 정하고 합의해야 한다."
                  ),
                  (
                      "잘하는 조직도 절반 이상이 3년을 못 버틴다는 뜻이다.",
                      "높은 성숙도에서도 프로젝트를 3년 이상 운영 상태로 유지한 비율이 절반에 못 미쳤다는 관찰이다."
                  ),
              ],
              "chapters/02_draft.md": [
                  (
                      "MIT의 연구는 실증이 가장 강하다. 1장에서 본 그 분포와 재무성과 상관이 거기서 나왔다.",
                      "MIT의 연구는 721개 기업 설문을 직접 근거로 둔다. 1장에서 본 그 분포와 재무성과 상관이 거기서 나왔다."
                  ),
              ],
              "chapters/05_draft.md": [
                  (
                      "사람이 눈으로 본다고 답했다면, 열두 개까지는 어떻게든 버틴다. 백 개가 되면 못 버틴다. 확인은 점점 형식이 되고, 형식이 된 확인은 없는 것과 같다.",
                      "사람이 눈으로 본다고 답했다면, 물량이 적을 때는 어떻게든 버틴다. 하지만 물량이 빠르게 늘면 사람 눈만으로는 버티기 어렵다. 확인은 점점 형식이 되고, 형식이 된 확인은 없는 것과 같다."
                  ),
                  (
                      "그 시차가 3단계까지는 조직을 지켜준다. 하나씩 만들어 하나씩 쓸 때는 청구서도 하나씩 오니까. 그런데 열두 개를 한 분기에 만들어 동시에 굴리기 시작하면 이 시차가 무너진다. 세 청구서가 거의 같은 분기에 한꺼번에 도착한다.",
                      "물량이 적을 때는 세 부채가 서로 다른 시점에 드러나서 한 번에 보이지 않는다. 그런데 여러 개를 동시에 굴리기 시작하면 그 시차가 짧아지고, 세 부채가 겹쳐 청구되기 시작한다."
                  ),
                  (
                      "열두 개를 굴리는 조직이 세 개를 굴리는 조직보다 성숙한 게 아니라, 빚이 네 배일 수도 있다는 뜻이다.",
                      "많이 굴리는 조직이 더 성숙한 게 아니라, 검증 없이 늘린 만큼 부채만 더 빠르게 늘 수 있다는 뜻이다."
                  ),
              ],
              "chapters/07_draft.md": [
                  (
                      "\n 여기서 새로 붙잡아둘 문장은 하나다.",
                      "\n여기서 새로 붙잡아둘 문장은 하나다."
                  ),
              ],
              "chapters/12_draft.md": [
                  (
                      "## 두 벽은 따로 오지 않는다",
                      "## 두 벽은 서로 얽힌다"
                  ),
              ],
              "chapters/14_draft.md": [
                  (
                      "그런데 말이 잘 통한다는 건 같은 것을 같은 각도로 본다는 뜻이다.",
                      "그런데 말이 잘 통하는 사람만 고르면 비슷한 관점만 모일 수 있다."
                  ),
              ],
              "chapters/15_draft.md": [
                  (
                      "그 순간부터 다음 진단의 답은 정해진다.",
                      "그 순간부터 다음 진단의 답에도 숫자를 올리고 싶은 압력이 들어가기 쉽다."
                  ),
              ],
              "scripts/run_auto_improve_book.sh": [
                  (
                      '''if [[ ! -f "$upstream" ]]; then
            echo "upstream improve.py not found: $upstream" >&2
            exit 2
          fi

          runtime_dir="${TMPDIR:-/tmp}/ax-book-auto-improve"''',
                      '''if [[ ! -f "$upstream" ]]; then
            echo "upstream improve.py not found: $upstream" >&2
            exit 2
          fi

          expected_upstream_sha="03aa5a9464b867bd8ce273841b07bcbf6890d7e7"
          actual_upstream_sha="$(git -C "$AUTO_IMPROVE_HOME" rev-parse HEAD 2>/dev/null || true)"
          if [[ "$actual_upstream_sha" != "$expected_upstream_sha" ]]; then
            echo "auto-improve checkout must be pinned to $expected_upstream_sha" >&2
            echo "current HEAD: ${actual_upstream_sha:-unknown}" >&2
            exit 2
          fi

          runtime_dir="${TMPDIR:-/tmp}/ax-book-auto-improve"'''
                  ),
              ],
          }

          for filename, replacements in edits.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected exactly one match, found {count}: {old[:80]!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
              print(f"updated {filename}: {len(replacements)} edits")
          PY

      - name: Rebuild integrated manuscript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              "chapters/00_intro_draft.md",
              "chapters/00_opening_draft.md",
              *[f"chapters/{i:02d}_draft.md" for i in range(1, 16)],
              "chapters/99_epilogue_draft.md",
              "chapters/A1_appendix_a_draft.md",
              "chapters/A2_appendix_b_draft.md",
              "chapters/A3_appendix_c_draft.md",
          ]

          def strip_front_matter(text: str) -> str:
              lines = text.splitlines()
              if lines and lines[0].strip() == "---":
                  for i, line in enumerate(lines[1:], 1):
                      if line.strip() == "---":
                          return "\n".join(lines[i + 1:]).rstrip() + "\n"
                  raise SystemExit("unclosed front matter")
              return text.rstrip() + "\n"

          combined = "\n\n".join(
              strip_front_matter(Path(name).read_text(encoding="utf-8"))
              for name in files
          )
          Path("04_manuscript.md").write_text(combined, encoding="utf-8")
          print("rebuilt 04_manuscript.md")
          PY

      - name: Build and validate site
        run: |
          bash scripts/build-site.sh
          git diff --check

      - name: Commit final fixes and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/pr6-final-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "병합 전 최종 문장과 재현성 보정"
            git push origin HEAD:agent/auto-improve-book-pilot
          fi
